# DDEV for the Vite project: no PHP and no database. `ddev start` runs the Vite dev server
# (see start-vite.sh) and serves it on https://arcade.ddev.site (the index) and https://arcade.ddev.site/underlord/.
name: arcade
type: generic
webserver_type: generic
docroot: ""
nodejs_version: "24"
corepack_enable: false
omit_containers: [db]
project_tld: ddev.site # DDEV's default, also when the global config sets another TLD
use_dns_when_possible: true
additional_hostnames: []
additional_fqdns: []
web_extra_daemons:
  - name: vite
    command: /var/www/html/.ddev/start-vite.sh
    directory: /var/www/html
web_extra_exposed_ports:
  - name: vite
    container_port: 5173
    http_port: 80
    https_port: 443
