  <path d="M40 22V248L158 168V102Z" fill="#0f0b24"/>
  <rect x="158" y="102" width="164" height="66" fill="#090716"/>
  <g fill="none" stroke="#7b5cff">
    <rect x="70" y="42" width="340" height="186" stroke-opacity=".5"/>
    <rect x="98" y="61" width="284" height="148" stroke-opacity=".42"/>
    <rect x="121" y="77" width="238" height="116" stroke-opacity=".34"/>
    <rect x="140" y="90" width="200" height="90" stroke-opacity=".26"/>
  </g>
