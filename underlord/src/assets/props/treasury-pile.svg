<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Gold pile on a Treasury tile; the game scales it with how full your treasuries are. Plants vs. Zombies style: thin dark-brown outlines,
       muted colours with soft airbrushed shading. -->
  <defs>
    <radialGradient id="pile" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset=".55" stop-color="#e0b23a"/>
      <stop offset="1" stop-color="#9a6e18"/>
    </radialGradient>
    <radialGradient id="coin" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset=".55" stop-color="#e8c04a"/>
      <stop offset="1" stop-color="#b8861e"/>
    </radialGradient>
  </defs>
  <g stroke="#2b1b12" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M8 52 Q16 22 32 17 Q48 22 56 52 Q32 60 8 52 Z" fill="url(#pile)"/>
    <ellipse cx="20" cy="50" rx="7" ry="3.4" fill="url(#coin)"/>
    <ellipse cx="20" cy="49.7" rx="4.4" ry="1.8" fill="none" stroke="#a8822c" stroke-width=".8"/>
    <ellipse cx="34" cy="52" rx="7" ry="3.4" fill="url(#coin)"/>
    <ellipse cx="34" cy="51.7" rx="4.4" ry="1.8" fill="none" stroke="#a8822c" stroke-width=".8"/>
    <ellipse cx="46" cy="49" rx="7" ry="3.4" fill="url(#coin)"/>
    <ellipse cx="46" cy="48.7" rx="4.4" ry="1.8" fill="none" stroke="#a8822c" stroke-width=".8"/>
    <ellipse cx="27" cy="44" rx="7" ry="3.4" fill="url(#coin)"/>
    <ellipse cx="27" cy="43.7" rx="4.4" ry="1.8" fill="none" stroke="#a8822c" stroke-width=".8"/>
    <ellipse cx="40" cy="44" rx="7" ry="3.4" fill="url(#coin)"/>
    <ellipse cx="40" cy="43.7" rx="4.4" ry="1.8" fill="none" stroke="#a8822c" stroke-width=".8"/>
    <ellipse cx="33" cy="37" rx="7" ry="3.4" fill="url(#coin)"/>
    <ellipse cx="33" cy="36.7" rx="4.4" ry="1.8" fill="none" stroke="#a8822c" stroke-width=".8"/>
    <path d="M22 30 Q27 22 33 20" fill="none" stroke="#fff6c8" stroke-width="2"/>
    <path d="M44 24 L45.2 26.8 L48 28 L45.2 29.2 L44 32 L42.8 29.2 L40 28 L42.8 26.8 Z" fill="#fffbe6" stroke-width=".8"/>
