<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Portal that is not yet yours: a swirling vortex in a stone ring. The game rotates it around its centre. Plants vs. Zombies style: thin dark-brown outlines,
       muted colours with soft airbrushed shading. -->
  <defs>
    <radialGradient id="ring" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#8a7e74"/>
      <stop offset="1" stop-color="#3e3632"/>
    </radialGradient>
    <radialGradient id="arm" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#a49ab4"/>
      <stop offset=".55" stop-color="#6d5a86"/>
      <stop offset="1" stop-color="#2e2638"/>
    </radialGradient>
    <radialGradient id="core" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#d8d0e2"/>
      <stop offset=".55" stop-color="#6d5a86"/>
      <stop offset="1" stop-color="#2e2638"/>
    </radialGradient>
  </defs>
  <g stroke="#2b1b12" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="32" cy="32" r="29" fill="url(#ring)" stroke-width="1.6"/>
    <circle cx="32" cy="32" r="23" fill="#140a1c" stroke-width="1.2"/>
    <path d="M32 32 Q54.0 32.0 41.2 57.4 Q42.7 41.0 32 32 Z" fill="url(#arm)" stroke-width="1.1"/>
    <path d="M32 32 Q21.0 51.1 5.4 27.3 Q18.8 36.8 32 32 Z" fill="url(#arm)" stroke-width="1.1"/>
    <path d="M32 32 Q21.0 12.9 49.4 11.3 Q34.4 18.2 32 32 Z" fill="url(#arm)" stroke-width="1.1"/>
    <circle cx="32" cy="32" r="6" fill="url(#core)" stroke-width="1.1"/>
    <circle cx="58.0" cy="32.0" r="1.6" fill="#b0a498" stroke-width=".9"/>
    <circle cx="50.4" cy="50.4" r="1.6" fill="#b0a498" stroke-width=".9"/>
    <circle cx="32.0" cy="58.0" r="1.6" fill="#b0a498" stroke-width=".9"/>
    <circle cx="13.6" cy="50.4" r="1.6" fill="#b0a498" stroke-width=".9"/>
    <circle cx="6.0" cy="32.0" r="1.6" fill="#b0a498" stroke-width=".9"/>
    <circle cx="13.6" cy="13.6" r="1.6" fill="#b0a498" stroke-width=".9"/>
    <circle cx="32.0" cy="6.0" r="1.6" fill="#b0a498" stroke-width=".9"/>
    <circle cx="50.4" cy="13.6" r="1.6" fill="#b0a498" stroke-width=".9"/>
