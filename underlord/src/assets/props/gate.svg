<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hero Gate, where the invaders come from: a white stone arch with gold trim and a bright blue-white glow. Plants vs. Zombies style: thin dark-brown outlines,
       muted colours with soft airbrushed shading. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eceae4"/>
      <stop offset="1" stop-color="#9a958a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#cfe2ff"/>
      <stop offset="1" stop-color="#7fb0f0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc7a"/>
      <stop offset="1" stop-color="#a8822c"/>
    </linearGradient>
  </defs>
  <g stroke="#2b1b12" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M7 60 L7 28 Q7 6 32 6 Q57 6 57 28 L57 60 Z" fill="url(#stone)"/>
    <path d="M17 60 L17 30 Q17 15 32 15 Q47 15 47 30 L47 60 Z" fill="url(#glow)"/>
    <path d="M12 26 L17 28 M10 40 L17 40 M52 26 L47 28 M54 40 L47 40 M27 9 L28 15 M37 9 L36 15" fill="none" stroke="#8a857a" stroke-width="1"/>
    <path d="M27 8.4 Q32 4.6 37 8.4 L35 13 Q32 11 29 13 Z" fill="url(#gold)"/>
    <path d="M21 56 Q21 36 25 26" fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".8"/>
  </g>
</svg>
