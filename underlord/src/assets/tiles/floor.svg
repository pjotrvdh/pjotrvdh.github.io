<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Unclaimed dug-out floor: dark packed dirt with a few pebbles. Plants vs. Zombies style: muted colours with soft airbrushed shading and thin
       dark-brown outlines on the details only, so the edges tile seamlessly. Mirrored at random in game. -->
  <defs>
    <radialGradient id="floor" cx=".5" cy=".5" r=".75">
      <stop offset="0" stop-color="#4a3a2e"/>
      <stop offset="1" stop-color="#33271e"/>
    </radialGradient>
    <radialGradient id="pebble" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#8a7a66"/>
      <stop offset="1" stop-color="#4e4234"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="url(#floor)"/>
  <ellipse cx="14" cy="17" rx="2.6" ry="1.8" fill="url(#pebble)" stroke="#2b1b12" stroke-width=".9"/>
  <ellipse cx="44" cy="12" rx="2" ry="1.5" fill="url(#pebble)" stroke="#2b1b12" stroke-width=".9"/>
  <ellipse cx="31" cy="38" rx="3" ry="2" fill="url(#pebble)" stroke="#2b1b12" stroke-width=".9"/>
  <ellipse cx="52" cy="47" rx="2.2" ry="1.6" fill="url(#pebble)" stroke="#2b1b12" stroke-width=".9"/>
  <ellipse cx="12" cy="51" rx="1.8" ry="1.3" fill="url(#pebble)" stroke="#2b1b12" stroke-width=".9"/>
  <ellipse cx="40" cy="56" rx="1.6" ry="1.2" fill="url(#pebble)" stroke="#2b1b12" stroke-width=".9"/>
  <path d="M20 28 Q24 30 27 28.5 M46 30 Q49 32 52 30.6" fill="none" stroke="#221810" stroke-width=".9" opacity=".7"/>
</svg>
