<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Your claimed territory: four outlined flagstones with your red keeper mark. Plants vs. Zombies style: muted colours with soft airbrushed shading and thin
       dark-brown outlines on the details only, so the edges tile seamlessly. Mirrored at random in game. -->
  <defs>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e3a30"/>
      <stop offset="1" stop-color="#4a2420"/>
    </linearGradient>
    <linearGradient id="flag2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64332a"/>
      <stop offset="1" stop-color="#43201c"/>
    </linearGradient>
    <radialGradient id="mark" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#f06a58"/>
      <stop offset="1" stop-color="#a02a22"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="#2a1512"/>
  <rect x="1.5" y="1.5" width="28.5" height="28.5" rx="3" fill="url(#flag)" stroke="#2b1b12" stroke-width="1.1"/>
  <rect x="34" y="1.5" width="28.5" height="28.5" rx="3" fill="url(#flag2)" stroke="#2b1b12" stroke-width="1.1"/>
  <rect x="1.5" y="34" width="28.5" height="28.5" rx="3" fill="url(#flag2)" stroke="#2b1b12" stroke-width="1.1"/>
  <rect x="34" y="34" width="28.5" height="28.5" rx="3" fill="url(#flag)" stroke="#2b1b12" stroke-width="1.1"/>
  <path d="M5 6 Q9 4.4 14 4.6 M38 6 Q42 4.4 47 4.6 M5 38.5 Q9 37 14 37.2 M38 38.5 Q42 37 47 37.2" fill="none" stroke="#9a5a4c" stroke-width="1.1"/>
  <path d="M32 24 L40 32 L32 40 L24 32 Z" fill="url(#mark)" stroke="#2b1b12" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M29 30 L32 27 L34 29" fill="none" stroke="#ffb3a6" stroke-width="1"/>
</svg>
