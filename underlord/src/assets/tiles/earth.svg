  <path d="M49.2 28.0 Q50.2 24.1 53.2 24.5 Q55.6 25.5 55.2 28.1 Q52.2 29.5 49.2 28.0 Z" fill="url(#clod)" stroke="#2b1b12" stroke-width="1"/>
  <path d="M16.0 29.9 Q17.0 26.0 20.0 26.4 Q22.4 27.4 22.0 30.0 Q19.0 31.4 16.0 29.9 Z" fill="url(#clod)" stroke="#2b1b12" stroke-width="1"/>
  <path d="M7.3 20.7 Q8.3 16.8 11.3 17.2 Q13.7 18.2 13.3 20.8 Q10.3 22.2 7.3 20.7 Z" fill="url(#clod)" stroke="#2b1b12" stroke-width="1"/>
