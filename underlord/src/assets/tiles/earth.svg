    <radialGradient id="earth" cx=".5" cy=".5" r=".75">
      <stop offset="0" stop-color="#8c6340"/>
      <stop offset="1" stop-color="#6a4628"/>
    </radialGradient>
    <radialGradient id="clod" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#a77b52"/>
      <stop offset="1" stop-color="#6e4a2a"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="url(#earth)"/>
  <ellipse cx="15.9" cy="47.3" rx="7.1" ry="3.8" fill="#4a2f18" opacity=".18"/>
  <ellipse cx="31.8" cy="29.8" rx="6.6" ry="5.4" fill="#4a2f18" opacity=".18"/>
  <ellipse cx="14.1" cy="11.2" rx="7.3" ry="4.3" fill="#4a2f18" opacity=".18"/>
  <ellipse cx="43.5" cy="10.1" rx="5.8" ry="5.2" fill="#4a2f18" opacity=".18"/>
  <ellipse cx="20.1" cy="51.6" rx="7.6" ry="3.1" fill="#4a2f18" opacity=".18"/>
