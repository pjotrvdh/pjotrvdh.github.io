<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Diggable earth. Plants vs. Zombies style: muted colours with soft airbrushed shading and thin
       dark-brown outlines on the details only, so the edges tile seamlessly. Mirrored at random in game. -->
