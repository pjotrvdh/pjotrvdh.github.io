  <ellipse cx="46.8" cy="31.0" rx="6.6" ry="3.5" fill="#4a2f18" opacity=".18"/>
  <ellipse cx="37.9" cy="48.2" rx="6.1" ry="5.2" fill="#4a2f18" opacity=".18"/>
