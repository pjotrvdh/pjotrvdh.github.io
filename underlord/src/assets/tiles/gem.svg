  <path d="M14 20 Q18 22 21 20.5 M40 44 Q44 46.5 48 44" fill="none" stroke="#2b1b12" stroke-width=".9" opacity=".7"/>
  <path d="M20 12 L27 22 L24 40 L16 40 L13 22 Z" fill="url(#cyan)" stroke="#2b1b12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M20 12 L20 40 M13 22 L27 22" fill="none" stroke="#e6fbff" stroke-width=".9" opacity=".7"/>
  <path d="M43 22 L51 31 L48 50 L38 50 L35 31 Z" fill="url(#violet)" stroke="#2b1b12" stroke-width="1.2" stroke-linejoin="round"/>
