  <path d="M40.9 37.7 Q41.9 33.8 44.9 34.2 Q47.3 35.2 46.9 37.8 Q43.9 39.2 40.9 37.7 Z" fill="url(#clod)" stroke="#2b1b12" stroke-width="1"/>
