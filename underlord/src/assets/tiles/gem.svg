<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Gem seam: earth with cut crystals; never runs out. Plants vs. Zombies style: muted colours with soft airbrushed shading and thin
       dark-brown outlines on the details only, so the edges tile seamlessly. Mirrored at random in game. -->
  <defs>
    <radialGradient id="earth" cx=".5" cy=".5" r=".75">
      <stop offset="0" stop-color="#8c6340"/>
      <stop offset="1" stop-color="#6a4628"/>
    </radialGradient>
    <radialGradient id="clod" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#a77b52"/>
      <stop offset="1" stop-color="#6e4a2a"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8f4ff"/>
      <stop offset=".5" stop-color="#56c6e0"/>
      <stop offset="1" stop-color="#1f6f88"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ead2ff"/>
      <stop offset=".5" stop-color="#b07ae8"/>
      <stop offset="1" stop-color="#5c2c94"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#earth)"/>
  <ellipse cx="20.5" cy="33.9" rx="5.5" ry="4.8" fill="#4a2f18" opacity=".18"/>
