<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Reinforced wall built by imps: outlined stone bricks. Plants vs. Zombies style: muted colours with soft airbrushed shading and thin
       dark-brown outlines on the details only, so the edges tile seamlessly. Mirrored at random in game. -->
  <defs>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a7c70"/>
      <stop offset="1" stop-color="#5a4e46"/>
    </linearGradient>
    <linearGradient id="brick2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c6e62"/>
      <stop offset="1" stop-color="#504540"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="#2e2622"/>
  <rect x="1.5" y="2" width="28" height="18" rx="2.5" fill="url(#brick)" stroke="#2b1b12" stroke-width="1.1"/>
  <path d="M4.5 5.4 L15.5 5.4" fill="none" stroke="#b3a598" stroke-width="1"/>
  <rect x="34.5" y="2" width="28" height="18" rx="2.5" fill="url(#brick2)" stroke="#2b1b12" stroke-width="1.1"/>
  <path d="M37.5 5.4 L48.5 5.4" fill="none" stroke="#b3a598" stroke-width="1"/>
  <rect x="-14" y="23" width="28" height="18" rx="2.5" fill="url(#brick2)" stroke="#2b1b12" stroke-width="1.1"/>
  <path d="M-11 26.4 L0.0 26.4" fill="none" stroke="#b3a598" stroke-width="1"/>
  <rect x="17.5" y="23" width="29" height="18" rx="2.5" fill="url(#brick)" stroke="#2b1b12" stroke-width="1.1"/>
  <path d="M20.5 26.4 L32.0 26.4" fill="none" stroke="#b3a598" stroke-width="1"/>
  <rect x="50" y="23" width="28" height="18" rx="2.5" fill="url(#brick2)" stroke="#2b1b12" stroke-width="1.1"/>
  <path d="M53 26.4 L64.0 26.4" fill="none" stroke="#b3a598" stroke-width="1"/>
  <rect x="1.5" y="44" width="28" height="18" rx="2.5" fill="url(#brick2)" stroke="#2b1b12" stroke-width="1.1"/>
  <path d="M4.5 47.4 L15.5 47.4" fill="none" stroke="#b3a598" stroke-width="1"/>
