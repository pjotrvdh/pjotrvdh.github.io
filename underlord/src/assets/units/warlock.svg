<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plants vs. Zombies style (thin dark-brown outlines, muted colours with soft airbrushed shading,
       hunched pose, heavy eyelids, limp bony hands), drawn after the Dungeon Keeper 1 warlock:
       long crimson robe with a tall pointed hood and gold toggle buttons, wide sleeves, gaunt bald
       brown face, long thin grey beard, bony hands with a spell glowing between them.
       Faces right; feet near y=58. -->
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b84a5c"/>
      <stop offset=".6" stop-color="#8c2d40"/>
      <stop offset="1" stop-color="#561a28"/>
    </linearGradient>
    <linearGradient id="robeDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a2536"/>
      <stop offset="1" stop-color="#40121d"/>
    </linearGradient>
    <radialGradient id="skin" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#c99368"/>
      <stop offset=".6" stop-color="#9a643c"/>
      <stop offset="1" stop-color="#5e3a1f"/>
    </radialGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8c3ae"/>
      <stop offset="1" stop-color="#8a8470"/>
    </linearGradient>
    <radialGradient id="spell" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset=".45" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d27a"/>
      <stop offset="1" stop-color="#a8822c"/>
    </linearGradient>
  </defs>

  <g stroke="#2b1b12" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">

    <!-- long robe falling to the floor, slightly hunched -->
    <path d="M17 58.5 Q16 40 22 32 Q27 27 33 27 Q41 27 45 33 Q49 41 48 58.5 Z" fill="url(#robe)"/>
    <path d="M38 30 Q45 36 45.5 58.5 L48 58.5 Q49 41 45 33 Q42.5 29.5 38 30 Z" fill="url(#robeDark)" stroke="none"/>
    <path d="M32 31 L31.5 58.5" fill="none" stroke="#4a1622" stroke-width="1"/>
    <path d="M29.5 36 L34 36 M29.4 42 L33.9 42 M29.3 48 L33.8 48" fill="none" stroke="url(#gold)" stroke-width="2.2"/>
    <path d="M19 58.5 Q20.5 46 24 38" fill="none" stroke="#c96374" stroke-width="1" opacity=".7"/>

    <!-- wide sleeves raised, bony hands with a spell glowing between them -->
    <path d="M23 35 Q15 39 14.5 46 L21 47 Q21.5 42 26 39.5 Z" fill="url(#robe)"/>
    <path d="M42 34 Q50.5 37 52 44 L45.5 45.5 Q44.5 41 40 39 Z" fill="url(#robe)"/>
    <circle cx="33" cy="47.5" r="7.5" fill="url(#spell)" stroke="none"/>
    <path d="M16 46 Q19 44.5 21.5 46.5 Q22.5 49 20 50.2 L17.6 49.8 Q15.8 48.5 16 46 Z" fill="url(#skin)"/>
    <path d="M21 49.5 L24.5 49.8 M20.4 48 L24 47.6" fill="none" stroke-width="1"/>
    <path d="M46 44.4 Q49 43 51.5 45 Q52.4 47.5 50 48.8 L47.6 48.4 Q45.8 47 46 44.4 Z" fill="url(#skin)"/>
    <path d="M46 47.6 L42.6 48.2 M46.4 46 L43 45.8" fill="none" stroke-width="1"/>

    <!-- tall pointed hood -->
    <path d="M18 31 Q17 15 26 7 Q31 2 34 0.6 Q37 4 41 9.5 Q47.5 18 46.5 31 Q41 26.5 32.5 26.5 Q23.5 26.5 18 31 Z" fill="url(#robe)"/>
    <path d="M37 6 Q45 16 45 29 Q46.8 22 46.5 18 Q44 11 37 6 Z" fill="url(#robeDark)" stroke="none"/>

    <!-- gaunt bald face, deep in the hood -->
    <path d="M23.5 21 Q23 11.5 32.5 11 Q42 11.5 41.5 21 Q41.5 27.5 37 30 Q32.5 32 28 30 Q23.5 27.5 23.5 21 Z" fill="url(#skin)"/>
    <path d="M25.8 23.5 Q27 27.5 29.5 28.8 M39.2 23.5 Q38 27.5 35.5 28.8" fill="none" stroke="#5e3a1f" stroke-width=".9"/>
    <path d="M28 14.4 Q32.5 13.2 37 14.4" fill="none" stroke="#5e3a1f" stroke-width=".8"/>

    <!-- tired eyes under heavy lids -->
    <ellipse cx="36.3" cy="19.2" rx="2.4" ry="1.9" fill="#f1e9cf"/>
    <ellipse cx="28.6" cy="19.4" rx="2" ry="1.7" fill="#f1e9cf"/>
    <circle cx="37" cy="19.6" r=".9" fill="#1a1110" stroke="none"/>
    <circle cx="29.2" cy="19.8" r=".8" fill="#1a1110" stroke="none"/>
    <path d="M33.6 18.7 Q36.3 16 39.2 18.5 Q36.3 17.6 33.6 18.7 Z M26.2 18.9 Q28.6 16.4 31 18.8 Q28.6 17.9 26.2 18.9 Z" fill="#7a4a2a"/>

    <!-- long hooked nose -->
    <path d="M32.5 19.5 Q37.5 22 36 25.3 Q33.8 25.6 32.2 24 Z" fill="url(#skin)"/>

    <!-- long thin grey beard hanging to the chest -->
    <path d="M28.5 27 Q32.5 30.5 37 27 Q36.5 34 34 41 Q33 44.5 32.5 46.5 Q31.6 43.5 30.6 40 Q28.8 33.5 28.5 27 Z" fill="url(#beard)"/>
    <path d="M31 30.5 L32.2 40 M34.4 30.6 L33.4 39" fill="none" stroke="#7a7462" stroke-width=".8"/>
    <path d="M29.6 26.4 Q32.8 28 36.2 26.4" fill="none" stroke="#3a1e12" stroke-width="1.1"/>
  </g>
</svg>
