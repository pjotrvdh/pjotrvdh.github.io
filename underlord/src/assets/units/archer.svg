<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plants vs. Zombies style (thin dark-brown outlines, muted colours with soft airbrushed shading,
       slightly stooped pose, heavy eyelids, flat feet), drawn after the Dungeon Keeper 1 archer:
       tanned man with short brown hair, red-orange leather jerkin, green breeches, brown boots,
       crossbow held level at the hip. Faces right; feet near y=58. -->
  <defs>
    <radialGradient id="skin" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#d9a074"/>
      <stop offset=".6" stop-color="#b0703f"/>
      <stop offset="1" stop-color="#6f4220"/>
    </radialGradient>
    <linearGradient id="jerkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2774a"/>
      <stop offset=".6" stop-color="#b54a28"/>
      <stop offset="1" stop-color="#6f2a14"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a9a54"/>
      <stop offset="1" stop-color="#3f5626"/>
    </linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5232"/>
      <stop offset="1" stop-color="#3f2814"/>
    </linearGradient>
    <radialGradient id="hair" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#8a5a32"/>
      <stop offset="1" stop-color="#4a2e16"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5754a"/>
      <stop offset="1" stop-color="#5e3b21"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e1e6ea"/>
      <stop offset="1" stop-color="#7e888f"/>
    </linearGradient>
  </defs>

  <g stroke="#2b1b12" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">

    <!-- legs in green breeches and boots -->
    <path d="M27 46 L26 52 M36.5 46 L38 52" fill="none" stroke-width="4"/>
    <path d="M27 46 L26 52 M36.5 46 L38 52" fill="none" stroke="#5a7a3a" stroke-width="2.4"/>
    <path d="M21 58.3 Q21 51.5 27.6 51.5 L28 58.3 Z" fill="url(#boot)"/>
    <path d="M36.6 51.5 Q43 51.5 44.5 58.3 L37.2 58.3 Z" fill="url(#boot)"/>
    <path d="M24.5 44.5 Q32 47.5 40 44.5 L39.6 49 Q32 51.6 25 49 Z" fill="url(#green)"/>

    <!-- red-orange leather jerkin with lacing and a belt -->
    <path d="M22 40 Q21 30 28.5 28 L36.5 28 Q44 30 42.5 40 Q42 45.5 32.3 46 Q22.6 45.5 22 40 Z" fill="url(#jerkin)"/>
    <path d="M30.6 30 L33.6 33 M33.6 30 L30.6 33 M30.6 34 L33.6 37 M33.6 34 L30.6 37" fill="none" stroke="#5e2410" stroke-width=".9"/>
    <path d="M22.6 41 Q32.3 44.4 42.2 40.6" fill="none" stroke="#3f2814" stroke-width="1.8"/>
    <path d="M24.5 31.5 Q25.4 29.6 27.6 29.2" fill="none" stroke="#f2a07a" stroke-width="1.1"/>

    <!-- bare tanned arms bringing the crossbow up -->
    <path d="M24 31 Q20 36 23 41" fill="none" stroke-width="3.6"/>
    <path d="M24 31 Q20 36 23 41" fill="none" stroke="#b0703f" stroke-width="2"/>
    <path d="M40.5 31 Q45 34.5 45 39" fill="none" stroke-width="3.6"/>
    <path d="M40.5 31 Q45 34.5 45 39" fill="none" stroke="#b0703f" stroke-width="2"/>

    <!-- crossbow held level at the hip -->
    <path d="M20 40.2 L53 38.8 L53.2 41.4 L20.2 42.6 Z" fill="url(#wood)"/>
    <path d="M50.5 31 Q55.5 40 50.5 49" fill="none" stroke="#2b1b12" stroke-width="2.6"/>
    <path d="M50.5 31 Q55.5 40 50.5 49" fill="none" stroke="url(#steel)" stroke-width="1.4"/>
    <path d="M50.5 31 L45 40 L50.5 49" fill="none" stroke="#efe9d8" stroke-width=".7"/>
    <path d="M44 39.4 L58.5 39 L56.2 37.6 M58.5 39 L56.3 40.6" fill="none" stroke="#2b1b12" stroke-width="1"/>
    <path d="M21.2 40.6 Q23.4 39.2 25.4 41 Q25.2 43.6 23.2 43.8 Q21.2 43.4 21.2 40.6 Z" fill="url(#skin)"/>
    <path d="M43 38.6 Q45.4 37.2 47.4 39 Q47.2 41.6 45.2 41.8 Q43 41.4 43 38.6 Z" fill="url(#skin)"/>

    <!-- head on a short neck, squinting along the bolt -->
    <path d="M23 18 Q22.5 8 32.5 7.6 Q42.5 8 42 18 Q42 25.5 37.5 28 Q32.5 30 28 28 Q23 25.5 23 18 Z" fill="url(#skin)"/>
    <path d="M25 24 Q26.4 27 29 28 M40 24 Q38.6 27 36 28" fill="none" stroke="#6f4220" stroke-width=".8"/>

    <!-- short brown hair -->
    <path d="M22 17 Q20.5 6 32.5 5 Q44 5.2 43 15.5 Q40 10.5 33 10.6 Q26 10.8 24 17.5 Z" fill="url(#hair)"/>
    <path d="M27 7.5 L28 10 M32 6.6 L32.4 9.6 M37 7 L36.6 9.8" fill="none" stroke="#3a2210" stroke-width=".9"/>

    <!-- eyes: one squinting along the bolt -->
    <ellipse cx="36.6" cy="17.6" rx="2.4" ry="1.3" fill="#f1e8d0"/>
    <circle cx="37.4" cy="17.7" r=".85" fill="#1a1110" stroke="none"/>
    <path d="M26.6 17.8 Q28.6 17 30.6 17.8" fill="none" stroke-width="1.2"/>
    <path d="M33.6 15.6 Q36.6 13.6 39.8 15.2 M25.6 15.6 Q28.4 14.2 31 15.4" fill="none" stroke="#3a2210" stroke-width="1.3"/>

    <!-- nose and a tight-lipped mouth -->
    <path d="M32.6 18.6 Q36.4 20.4 35.2 23 Q33.6 23.4 32.4 22.4" fill="none" stroke-width="1"/>
    <path d="M30.6 25.4 Q33.6 26.2 36.8 25" fill="none" stroke="#5e2a14" stroke-width="1.2"/>
  </g>
</svg>
