<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plants vs. Zombies style (thin dark-brown outlines, muted colours with soft airbrushed shading,
       heavy stooped pose, flat feet), drawn after the Dungeon Keeper 1 knight: full bronze plate
       armour, closed great helm with a narrow eye slit and big curved bull horns, large sword raised.
       Faces right; feet near y=58. -->
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3c98a"/>
      <stop offset=".5" stop-color="#a88748"/>
      <stop offset="1" stop-color="#5e4720"/>
    </linearGradient>
    <linearGradient id="bronzeDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c7c40"/>
      <stop offset="1" stop-color="#4a3818"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8f6a2c"/>
      <stop offset="1" stop-color="#f0d690"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f5f7"/>
      <stop offset="1" stop-color="#8f9aa2"/>
    </linearGradient>
  </defs>

  <g stroke="#2b1b12" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">

    <!-- large sword raised in the near hand -->
    <path d="M51.5 42.5 L57 6 L59.6 8.5 L54.4 43 Z" fill="url(#blade)"/>
    <path d="M57.4 8 L54.2 41" fill="none" stroke="#b9c2c8" stroke-width=".7"/>
    <path d="M48.8 41.6 L57.6 43.4" fill="none" stroke-width="3"/>
    <path d="M48.8 41.6 L57.6 43.4" fill="none" stroke="url(#horn)" stroke-width="1.6"/>

    <!-- armoured legs and sabatons -->
    <path d="M26 50 L25 54 M38 50 L39 54" fill="none" stroke-width="6"/>
    <path d="M26 50 L25 54 M38 50 L39 54" fill="none" stroke="#a88748" stroke-width="4.2"/>
    <path d="M18 58.3 Q18.5 53.4 26.6 53.4 L27.4 58.3 Z" fill="url(#bronzeDark)"/>
    <path d="M37 53.4 Q45.4 53.4 46.4 58.3 L37.6 58.3 Z" fill="url(#bronzeDark)"/>

    <!-- breastplate with a skirt of plates -->
    <path d="M15.5 42 Q14.5 28.5 26 26.5 L39 26.5 Q50.5 28.5 49 42 Q48 51 32 51.5 Q16.5 51 15.5 42 Z" fill="url(#bronze)"/>
    <path d="M32 28 L32 44 M21 35 Q32 39 43.5 35" fill="none" stroke="#5e4720" stroke-width="1"/>
    <path d="M17 44 Q32 49 47.6 43.6 L47 49 Q32 54 17.6 49.4 Z" fill="url(#bronzeDark)"/>
    <path d="M24.4 45.6 L24.8 51 M32 46.6 L32 52 M39.6 45.6 L39.2 51" fill="none" stroke="#3a2a10" stroke-width=".8"/>
    <path d="M21 30.5 Q23 28.4 26.4 28.2" fill="none" stroke="#f4e2b0" stroke-width="1.2"/>

    <!-- pauldrons and gauntlets -->
    <path d="M14 31 Q14.5 25 22 25.5 Q24 30 20 34 Q16 34.5 14 31 Z" fill="url(#bronze)"/>
    <path d="M15.5 33 Q12.5 38 13.5 44" fill="none" stroke-width="5.2"/>
    <path d="M15.5 33 Q12.5 38 13.5 44" fill="none" stroke="#a88748" stroke-width="3.4"/>
    <path d="M10.8 43 Q13.6 41.2 16.4 43.2 Q16.4 46.8 13.6 47.2 Q10.8 46.8 10.8 43 Z" fill="url(#bronzeDark)"/>
    <path d="M50 31 Q49.5 25 42 25.5 Q40 30 44 34 Q48 34.5 50 31 Z" fill="url(#bronze)"/>
    <path d="M47.5 33 Q51.5 37 51.5 41.5" fill="none" stroke-width="5.2"/>
    <path d="M47.5 33 Q51.5 37 51.5 41.5" fill="none" stroke="#a88748" stroke-width="3.4"/>
    <path d="M48.6 40.4 Q51.4 38.6 54.2 40.6 Q54.2 44.2 51.4 44.6 Q48.6 44.2 48.6 40.4 Z" fill="url(#bronzeDark)"/>

    <!-- closed great helm with big curved bull horns -->
    <path d="M21 7.5 Q13 6 10 -1 Q8.5 7 18 13 Z" fill="url(#horn)"/>
    <path d="M43 7.5 Q51 6 54 -1 Q55.5 7 46 13 Z" fill="url(#horn)"/>
    <path d="M20 23 Q19 6 32 5.5 Q45 6 44 23 Q44 27.5 39 28.4 L25 28.4 Q20 27.5 20 23 Z" fill="url(#bronze)"/>
    <path d="M38 7.5 Q43.5 12 43.4 23 Q43.6 27 39.6 28 Q42 20 38 7.5 Z" fill="url(#bronzeDark)" stroke="none"/>
    <path d="M32 6 L32 28" fill="none" stroke="#5e4720" stroke-width="1.1"/>
    <path d="M23.5 15.2 Q32 14 41 15.2 L41 17.4 Q32 16.4 23.5 17.4 Z" fill="#1c140a"/>
    <path d="M28 20 L28 25.6 M31 20.4 L31 26 M34 20.4 L34 26 M37 20 L37 25.6" fill="none" stroke="#3a2a10" stroke-width="1"/>
    <path d="M24 9.6 Q27 7.4 31 7.2" fill="none" stroke="#f4e2b0" stroke-width="1.2"/>
    <circle cx="32" cy="5.4" r="1.6" fill="url(#bronzeDark)"/>
  </g>
</svg>
