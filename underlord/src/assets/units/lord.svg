<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plants vs. Zombies style (thin dark-brown outlines, muted colours with soft airbrushed shading,
       heavy proud pose, flat feet), drawn after the Dungeon Keeper 1 Lord of the Land, a knight of
       the realm: polished silver plate with gold trim, closed great helm with curved horns and a
       gold crown band, royal purple sash and cape, great sword. Drawn larger in game. Faces right;
       feet near y=58. -->
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset=".5" stop-color="#b3bcc4"/>
      <stop offset="1" stop-color="#626c75"/>
    </linearGradient>
    <linearGradient id="silverDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3adb6"/>
      <stop offset="1" stop-color="#4c555d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc7a"/>
      <stop offset="1" stop-color="#a8822c"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b9a679"/>
      <stop offset="1" stop-color="#f6efd8"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a5ab8"/>
      <stop offset="1" stop-color="#4a2160"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9aa5ad"/>
    </linearGradient>
  </defs>

  <g stroke="#2b1b12" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">

    <!-- royal purple cape behind -->
    <path d="M13 30 Q8 44 7 58.5 L57 58.5 Q55 44 51 30 Q32 25 13 30 Z" fill="url(#purple)"/>
    <path d="M10 57 Q12 44 16.5 34" fill="none" stroke="#b884d0" stroke-width="1" opacity=".8"/>

    <!-- great sword held point-down at the side -->
    <path d="M53 40 L56.6 4.5 L59.4 7 L55.8 40.6 Z" fill="url(#blade)"/>
    <path d="M50 39.6 L59.2 41.4" fill="none" stroke-width="3"/>
    <path d="M50 39.6 L59.2 41.4" fill="none" stroke="url(#gold)" stroke-width="1.6"/>

    <!-- armoured legs -->
    <path d="M26 50 L25 54 M38 50 L39 54" fill="none" stroke-width="6"/>
    <path d="M26 50 L25 54 M38 50 L39 54" fill="none" stroke="#b3bcc4" stroke-width="4.2"/>
    <path d="M18 58.3 Q18.5 53.4 26.6 53.4 L27.4 58.3 Z" fill="url(#silverDark)"/>
    <path d="M37 53.4 Q45.4 53.4 46.4 58.3 L37.6 58.3 Z" fill="url(#silverDark)"/>

    <!-- polished breastplate with gold trim and a purple sash -->
    <path d="M15.5 42 Q14.5 28.5 26 26.5 L39 26.5 Q50.5 28.5 49 42 Q48 51 32 51.5 Q16.5 51 15.5 42 Z" fill="url(#silver)"/>
    <path d="M17 44 Q32 49 47.6 43.6 L47 49 Q32 54 17.6 49.4 Z" fill="url(#purple)"/>
    <path d="M18 31 Q32 26.8 46 31" fill="none" stroke="url(#gold)" stroke-width="1.8"/>
    <path d="M32 28.5 L32 44" fill="none" stroke="#626c75" stroke-width="1"/>
    <circle cx="32" cy="36" r="2.6" fill="url(#gold)"/>
    <path d="M21 32.5 Q23 30.4 26.4 30.2" fill="none" stroke="#ffffff" stroke-width="1.2"/>

    <!-- pauldrons and gauntlets -->
    <path d="M14 31 Q14.5 25 22 25.5 Q24 30 20 34 Q16 34.5 14 31 Z" fill="url(#silver)"/>
    <path d="M15.5 33 Q12.5 38 13.5 44" fill="none" stroke-width="5.2"/>
    <path d="M15.5 33 Q12.5 38 13.5 44" fill="none" stroke="#b3bcc4" stroke-width="3.4"/>
    <path d="M10.8 43 Q13.6 41.2 16.4 43.2 Q16.4 46.8 13.6 47.2 Q10.8 46.8 10.8 43 Z" fill="url(#silverDark)"/>
    <path d="M50 31 Q49.5 25 42 25.5 Q40 30 44 34 Q48 34.5 50 31 Z" fill="url(#silver)"/>
    <path d="M47.5 33 Q52 36.5 53 39.4" fill="none" stroke-width="5.2"/>
    <path d="M47.5 33 Q52 36.5 53 39.4" fill="none" stroke="#b3bcc4" stroke-width="3.4"/>
    <path d="M50.6 38.4 Q53.4 36.6 56.2 38.6 Q56.2 42.2 53.4 42.6 Q50.6 42.2 50.6 38.4 Z" fill="url(#silverDark)"/>

    <!-- closed great helm with curved horns and a gold crown band -->
    <path d="M21 9 Q13 7.4 10.5 0.5 Q9 8.5 18.5 14 Z" fill="url(#horn)"/>
    <path d="M43 9 Q51 7.4 53.5 0.5 Q55 8.5 45.5 14 Z" fill="url(#horn)"/>
    <path d="M20 23 Q19 7 32 6.5 Q45 7 44 23 Q44 27.5 39 28.4 L25 28.4 Q20 27.5 20 23 Z" fill="url(#silver)"/>
    <path d="M38 8.5 Q43.5 13 43.4 23 Q43.6 27 39.6 28 Q42 20 38 8.5 Z" fill="url(#silverDark)" stroke="none"/>
    <path d="M23.5 15.6 Q32 14.4 41 15.6 L41 17.8 Q32 16.8 23.5 17.8 Z" fill="#14181c"/>
    <path d="M28 20.4 L28 25.6 M31 20.6 L31 26 M34 20.6 L34 26 M37 20.4 L37 25.6" fill="none" stroke="#4c555d" stroke-width="1"/>
    <path d="M20.6 12 L22.6 4.6 L26.4 9.4 L32 2.4 L37.6 9.4 L41.4 4.6 L43.4 12 Q32 9.6 20.6 12 Z" fill="url(#gold)"/>
    <circle cx="32" cy="7.2" r="1.4" fill="#c43d7e" stroke-width=".8"/>
  </g>
</svg>
