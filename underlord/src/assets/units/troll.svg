<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plants vs. Zombies style (thin dark-brown outlines, muted colours with soft airbrushed shading,
       hunched pose with no neck, heavy brow, flat feet), drawn after the Dungeon Keeper 1 troll:
       lumpy olive-green skin, squat and stooped, knobbly head with bony ridges, small eyes,
       big mouth with a red tongue hanging out, long arms, wooden club. Faces right; feet near y=58. -->
  <defs>
    <radialGradient id="skin" cx=".38" cy=".28" r=".85">
      <stop offset="0" stop-color="#b6b56a"/>
      <stop offset=".55" stop-color="#848a3e"/>
      <stop offset="1" stop-color="#4c5320"/>
    </radialGradient>
    <radialGradient id="skinDark" cx=".4" cy=".3" r=".9">
      <stop offset="0" stop-color="#7d8238"/>
      <stop offset="1" stop-color="#40461a"/>
    </radialGradient>
    <radialGradient id="eye" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="1" stop-color="#d9b04a"/>
    </radialGradient>
    <radialGradient id="tongue" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="1" stop-color="#b2322c"/>
    </radialGradient>
    <linearGradient id="club" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a77a48"/>
      <stop offset="1" stop-color="#5a3a1c"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e5636"/>
      <stop offset="1" stop-color="#43321d"/>
    </linearGradient>
  </defs>

  <g stroke="#2b1b12" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">

    <!-- far arm hanging long, almost to the ground -->
    <path d="M17 34 Q10 42 11 52" fill="none" stroke-width="5.4"/>
    <path d="M17 34 Q10 42 11 52" fill="none" stroke="#757b36" stroke-width="3.6"/>
    <path d="M8 51.5 Q11 49.5 14 51.5 Q14.5 55 11.2 55.6 Q8 55 8 51.5 Z" fill="url(#skinDark)"/>

    <!-- short bowed legs and big flat feet -->
    <path d="M25 50 L23 55.5" fill="none" stroke-width="5.4"/>
    <path d="M25 50 L23 55.5" fill="none" stroke="#757b36" stroke-width="3.6"/>
    <path d="M39 50 L41 55.5" fill="none" stroke-width="5.4"/>
    <path d="M39 50 L41 55.5" fill="none" stroke="#757b36" stroke-width="3.6"/>
    <path d="M15.5 58.3 Q16 54.6 24.5 54.8 L25.2 58.3 Z" fill="url(#skinDark)"/>
    <path d="M39 54.8 Q47.5 54.6 48.5 58.3 L39.6 58.3 Z" fill="url(#skinDark)"/>

    <!-- squat stooped body with a loincloth -->
    <path d="M16 42 Q14.5 28 27 25.5 L38 25.5 Q50 28 48.5 42 Q47.5 52 32 52.5 Q17 52 16 42 Z" fill="url(#skin)"/>
    <path d="M24 36 Q28 38.5 32 36.5 M34.5 37 Q39 39.5 43 36" fill="none" stroke="#4c5320" stroke-width=".9"/>
    <circle cx="22" cy="31" r="1.3" fill="#6e7432" stroke="none"/><circle cx="41" cy="33" r="1.1" fill="#6e7432" stroke="none"/>
    <path d="M22 47.5 Q32 51.5 42 47.5 L40.5 54 L35.5 52 L32.4 55 L29.2 52 L24 54 Z" fill="url(#cloth)"/>

    <!-- near arm hefting a wooden club over the shoulder -->
    <path d="M45.5 31 Q53 35 52.5 43" fill="none" stroke-width="5.4"/>
    <path d="M45.5 31 Q53 35 52.5 43" fill="none" stroke="#848a3e" stroke-width="3.6"/>
    <path d="M51.5 45 L58.5 20.5 Q59.5 14 64 15.5 Q63.8 22 57.6 26 L54.4 45.6 Z" fill="url(#club)"/>
    <circle cx="61" cy="18" r=".9" fill="#3d2814" stroke="none"/><circle cx="59.4" cy="22.6" r=".8" fill="#3d2814" stroke="none"/>
    <path d="M49.6 42.6 Q52.6 40.6 55.6 42.8 Q55.4 46.6 52.6 47 Q49.6 46.4 49.6 42.6 Z" fill="url(#skinDark)"/>

    <!-- big knobbly head pushed forward on the shoulders (no neck) -->
    <path d="M19 19 Q18 7 32 6.5 Q47 7 48 19 Q49 28 43 31.5 Q37.5 34.5 31 34 Q24 33.6 21 29.5 Q19 25.5 19 19 Z" fill="url(#skin)"/>
    <path d="M23 9.5 L21 4.5 L26.2 7.8 Z M30 7 L30.6 2.2 L34 6.6 Z M38.5 7.2 L41.5 3 L42.4 8.6 Z" fill="url(#skinDark)"/>
    <path d="M22 13 Q32 9.6 44.5 12.4" fill="none" stroke="#4c5320" stroke-width="1"/>
    <circle cx="26" cy="11" r="1.1" fill="#6e7432" stroke="none"/><circle cx="44" cy="22" r="1" fill="#6e7432" stroke="none"/>

    <!-- heavy brow over small eyes -->
    <ellipse cx="38.5" cy="18.4" rx="2.4" ry="2.1" fill="url(#eye)"/>
    <ellipse cx="29" cy="18.8" rx="2" ry="1.8" fill="url(#eye)"/>
    <circle cx="39.2" cy="18.8" r=".95" fill="#1a1110" stroke="none"/>
    <circle cx="29.6" cy="19.2" r=".8" fill="#1a1110" stroke="none"/>
    <path d="M24.5 17.4 Q29 13.4 33.4 16.2 Q34.6 15 35.6 15.8 Q39.5 12.8 44 16.4 Q39.6 15.6 34.8 18 Q29.4 15.6 24.5 17.4 Z" fill="url(#skinDark)"/>

    <!-- bulbous nose -->
    <path d="M33 19.5 Q39 19.5 39 23.8 Q36 25.6 32.6 24.4 Q31 22 33 19.5 Z" fill="url(#skinDark)"/>

    <!-- big gaping mouth with the tongue lolling out -->
    <path d="M23.5 25.5 Q33.5 33.5 45 26 Q41.5 32.8 33.5 33 Q26.5 32.8 23.5 25.5 Z" fill="#3a1410"/>
    <path d="M26 27.2 L27.2 29.2 L28.4 27.8 Z M40.6 27.6 L41.6 29.4 L42.6 27.4 Z" fill="#efe6c8" stroke-width=".6"/>
    <path d="M30 30.5 Q34.5 29 38.5 30.8 Q39.5 36.5 35.4 38.6 Q31 38.4 30 34.2 Z" fill="url(#tongue)"/>
    <path d="M34.3 31.4 L34.7 36.4" fill="none" stroke="#8a2420" stroke-width=".8"/>
  </g>
</svg>
