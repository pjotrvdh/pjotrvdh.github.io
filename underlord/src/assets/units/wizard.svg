<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plants vs. Zombies style (thin dark-brown outlines, muted colours with soft airbrushed shading,
       stooped pose, heavy eyelids), drawn after the Dungeon Keeper 1 wizard: long grey-lilac robe,
       floppy pointed hat in the same colour, long white-grey beard, wooden staff topped with a red orb.
       Faces right; feet near y=58. -->
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2b6d0"/>
      <stop offset=".6" stop-color="#8f84a3"/>
      <stop offset="1" stop-color="#55496a"/>
    </linearGradient>
    <linearGradient id="robeDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b7090"/>
      <stop offset="1" stop-color="#3f3550"/>
    </linearGradient>
    <radialGradient id="skin" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#e9b892"/>
      <stop offset=".6" stop-color="#c08560"/>
      <stop offset="1" stop-color="#7f5234"/>
    </radialGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1e6"/>
      <stop offset="1" stop-color="#a9a28e"/>
    </linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".7">
      <stop offset="0" stop-color="#ffb4a8"/>
      <stop offset=".5" stop-color="#d8344a"/>
      <stop offset="1" stop-color="#7a1424"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5754a"/>
      <stop offset="1" stop-color="#5e3b21"/>
    </linearGradient>
  </defs>

  <g stroke="#2b1b12" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">

    <!-- staff with a red orb, held in the near hand -->
    <path d="M51 58 L52.5 14" fill="none" stroke-width="3.6"/>
    <path d="M51 58 L52.5 14" fill="none" stroke="url(#wood)" stroke-width="2.2"/>
    <path d="M49.4 13.4 Q52.5 9.4 55.8 13.4" fill="none" stroke="#6b4a2e" stroke-width="1.6"/>
    <circle cx="52.6" cy="9" r="4.6" fill="url(#orb)"/>
    <circle cx="51" cy="7.4" r="1.2" fill="#fff" stroke="none" opacity=".8"/>

    <!-- long robe to the floor -->
    <path d="M16 58.5 Q15.5 40 21.5 32 Q26.5 27 32.5 27 Q40 27 44.5 33 Q48.5 41 48 58.5 Z" fill="url(#robe)"/>
    <path d="M38.5 30 Q45 36 45.5 58.5 L48 58.5 Q48.5 41 44.5 33 Q42 29.6 38.5 30 Z" fill="url(#robeDark)" stroke="none"/>
    <path d="M18 58.5 Q19.4 47 23 39" fill="none" stroke="#ddd3e6" stroke-width="1" opacity=".8"/>
    <path d="M22 45 Q32 48 43 45" fill="none" stroke="#55496a" stroke-width="1.6"/>

    <!-- wide sleeves and hands -->
    <path d="M22.5 34 Q15 38 14.5 45 L20.5 46 Q21 41.4 25.5 38.5 Z" fill="url(#robe)"/>
    <path d="M15 44.6 Q18 43 20.6 45 Q21 48 18.4 48.6 Q15.4 48 15 44.6 Z" fill="url(#skin)"/>
    <path d="M42.5 33 Q49.5 35.5 51.5 41 L46 42.6 Q44.5 38.6 40.5 37.5 Z" fill="url(#robe)"/>
    <path d="M48.8 38.8 Q51.6 37.4 53.8 39.4 Q53.8 42.4 51.2 42.8 Q48.8 42.2 48.8 38.8 Z" fill="url(#skin)"/>

    <!-- kindly old face -->
    <path d="M23.5 20 Q23 12 32.5 11.6 Q42 12 41.5 20 Q41.5 26.5 37 28.8 Q32.5 30.6 28 28.8 Q23.5 26.5 23.5 20 Z" fill="url(#skin)"/>
    <path d="M27 14.6 Q32 13.4 37 14.6" fill="none" stroke="#7f5234" stroke-width=".8"/>

    <!-- long white-grey beard -->
    <path d="M23.5 22.5 Q23 34 27 41 Q30 45.5 32.5 47 Q35.5 45.5 38 41 Q42 34 41.5 22.5 Q38.5 27 35.5 26.5 L29.5 26.5 Q26.5 27 23.5 22.5 Z" fill="url(#beard)"/>
    <path d="M27.5 30 Q29 37 31 42 M32.5 29 L32.6 44 M37.5 30 Q36 37 34 42" fill="none" stroke="#a9a28e" stroke-width=".8"/>
    <path d="M27.4 25.8 Q30 23.4 32.6 25.2 Q35.2 23.4 37.8 25.8 Q38 28.6 35 28.2 Q33.6 27.6 32.6 26.6 Q31.4 27.6 30 28.2 Q27 28.6 27.4 25.8 Z" fill="url(#beard)"/>

    <!-- nose and droopy eyes under bushy white brows -->
    <path d="M31 19 Q36 19.4 35.6 23 Q33.4 24.4 31 23.4 Q30 21 31 19 Z" fill="#d79a74"/>
    <ellipse cx="36.4" cy="18" rx="2" ry="1.6" fill="#f1e8d0"/><circle cx="37" cy="18.3" r=".8" fill="#1a1110" stroke="none"/>
    <ellipse cx="28.4" cy="18.2" rx="1.8" ry="1.5" fill="#f1e8d0"/><circle cx="28.9" cy="18.5" r=".7" fill="#1a1110" stroke="none"/>
    <path d="M33.6 17 Q36.6 14.6 39.6 16.6 Q36.6 16 33.6 17.6 Z M25.6 17 Q28.4 14.8 31.2 16.8 Q28.4 16.2 25.6 17.6 Z" fill="url(#beard)"/>

    <!-- floppy pointed hat, tip flopping backwards -->
    <path d="M19 15 Q24 13 32.5 12.6 Q41 13 46 15 Q43 18.4 32.5 18 Q22 18.4 19 15 Z" fill="url(#robeDark)"/>
    <path d="M23 14.4 Q24 6 30 2.4 Q33 0.6 34.5 2.4 Q31.4 3.6 28.6 6.4 Q37 5.2 40.6 13.8 Q32 11.6 23 14.4 Z" fill="url(#robe)"/>
    <path d="M28.6 6.4 Q25 7.6 22 5.2 Q24.4 3.4 28 4.4" fill="url(#robe)"/>
    <path d="M27 11.8 Q28.6 8 32 6.4" fill="none" stroke="#ddd3e6" stroke-width="1"/>
  </g>
</svg>
