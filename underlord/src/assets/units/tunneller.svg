<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plants vs. Zombies style (thin dark-brown outlines, muted colours with soft airbrushed shading,
       stocky stooped pose, heavy eyelids, flat feet), drawn after the Dungeon Keeper 1 tunneller:
       short dwarf with a huge blond beard and moustache, steel helmet with two curved horns,
       chain mail over red sleeves, big axe over the shoulder. Faces right; feet near y=58. -->
  <defs>
    <radialGradient id="skin" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#f1c49a"/>
      <stop offset=".6" stop-color="#cf8f62"/>
      <stop offset="1" stop-color="#8f5a36"/>
    </radialGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc72"/>
      <stop offset=".6" stop-color="#d9b03a"/>
      <stop offset="1" stop-color="#9a7620"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe4e8"/>
      <stop offset=".5" stop-color="#9aa3aa"/>
      <stop offset="1" stop-color="#5c646b"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b9a679"/>
      <stop offset="1" stop-color="#f4ecd4"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4574a"/>
      <stop offset="1" stop-color="#7f2620"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6a3c"/>
      <stop offset="1" stop-color="#5f3c1f"/>
    </linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5232"/>
      <stop offset="1" stop-color="#3f2814"/>
    </linearGradient>
    <pattern id="mail" width="2.6" height="2.6" patternUnits="userSpaceOnUse">
      <rect width="2.6" height="2.6" fill="#8e979e"/>
      <circle cx="1.3" cy="1.3" r=".9" fill="none" stroke="#5c646b" stroke-width=".5"/>
    </pattern>
  </defs>

  <g stroke="#2b1b12" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">

    <!-- big axe over the near shoulder -->
    <path d="M48 47 L56 18" fill="none" stroke-width="3.8"/>
    <path d="M48 47 L56 18" fill="none" stroke="url(#wood)" stroke-width="2.4"/>
    <path d="M53.6 13 Q46.5 16 47.8 24.5 L55.4 22.4 Z" fill="url(#steel)"/>
    <path d="M56.6 12.2 Q63.5 13.5 63.2 21.5 L57.2 22.4 Z" fill="url(#steel)"/>

    <!-- short legs in boots -->
    <path d="M26 49 L25 53.5 M38 49 L39 53.5" fill="none" stroke-width="5.4"/>
    <path d="M26 49 L25 53.5 M38 49 L39 53.5" fill="none" stroke="#7f2620" stroke-width="3.6"/>
    <path d="M18.5 58.3 Q19 53 26.5 53 L27.4 58.3 Z" fill="url(#boot)"/>
    <path d="M37 53 Q45 53 46 58.3 L37.6 58.3 Z" fill="url(#boot)"/>

    <!-- stocky body in chain mail with a belt -->
    <path d="M15.5 44 Q14.5 30 26 28 L39 28 Q50 30 49 44 Q48 51 32 51.5 Q16.5 51 15.5 44 Z" fill="url(#mail)"/>
    <path d="M16 44.5 Q32 49.5 48.6 44 L48.4 47.6 Q32 52.6 16.2 48 Z" fill="url(#boot)"/>
    <rect x="29.4" y="45.4" width="5.2" height="4" rx=".8" fill="#d9b03a" stroke-width=".9"/>

    <!-- red sleeves and hands -->
    <path d="M19 31 Q12.5 36 13 43 L18.5 43.5 Q18.5 38 23 35 Z" fill="url(#red)"/>
    <path d="M12.6 42.4 Q15.4 40.6 18 42.6 Q18 46 15.3 46.4 Q12.6 46 12.6 42.4 Z" fill="url(#skin)"/>
    <path d="M44 31 Q50.5 34.5 51 41 L45.6 42 Q45 37 40.5 35 Z" fill="url(#red)"/>
    <path d="M46.2 40 Q49 38.2 51.6 40.2 Q51.6 43.6 48.9 44 Q46.2 43.6 46.2 40 Z" fill="url(#skin)"/>

    <!-- face under the helmet -->
    <path d="M20.5 19 Q20.5 11 32 10.5 Q43.5 11 43.5 19 Q43.5 25 38 27 L26 27 Q20.5 25 20.5 19 Z" fill="url(#skin)"/>

    <!-- huge blond beard and moustache down to the belt -->
    <path d="M19.5 21 Q19 33 23 41 Q27 46 32 46.5 Q37 46 41 41 Q45 33 44.5 21 Q41.5 26 37.5 25.5 L26.5 25.5 Q22.5 26 19.5 21 Z" fill="url(#beard)"/>
    <path d="M24 30 Q25.5 37 28.5 42 M32 30 L32 44 M40 30 Q38.5 37 35.5 42" fill="none" stroke="#9a7620" stroke-width=".9"/>
    <path d="M25 24.5 Q29 21.5 32.4 24 Q36 21.5 40 24.5 Q41 28.6 36.6 28.4 Q34 27.6 32.4 26.2 Q30.6 27.6 28 28.4 Q23.6 28.6 25 24.5 Z" fill="url(#beard)"/>

    <!-- big nose and narrowed eyes under bushy brows -->
    <path d="M30 18 Q36 17.6 36.4 22 Q33.4 24.4 30 23 Q28.6 20.4 30 18 Z" fill="#d88e64"/>
    <circle cx="37.6" cy="17.2" r="1.7" fill="#f1e8d0"/><circle cx="38.1" cy="17.4" r=".8" fill="#1a1110" stroke="none"/>
    <circle cx="26.6" cy="17.4" r="1.5" fill="#f1e8d0"/><circle cx="27" cy="17.6" r=".7" fill="#1a1110" stroke="none"/>
    <path d="M34.4 16 Q37.6 13.6 41 15.6 Q37.6 15.2 34.4 16.6 Z M23.4 16 Q26.6 13.8 29.8 15.8 Q26.6 15.2 23.4 16.6 Z" fill="url(#beard)"/>

    <!-- steel helmet with two curved horns -->
    <path d="M18.5 15 Q18.5 4.5 32 4 Q45.5 4.5 45.5 15 Q32 11.5 18.5 15 Z" fill="url(#steel)"/>
    <path d="M18.4 15 Q32 11.4 45.6 15 L45.4 17 Q32 13.4 18.6 17 Z" fill="#6f777e"/>
    <path d="M32 4.2 L32 13" fill="none" stroke="#6f777e" stroke-width="1.2"/>
    <path d="M19.5 11 Q12 9 11.5 1 Q16 6 21 7 Z" fill="url(#horn)"/>
    <path d="M44.5 11 Q52 9 52.5 1 Q48 6 43 7 Z" fill="url(#horn)"/>
    <path d="M24 7.5 Q28 5.6 32 5.6" fill="none" stroke="#f4f7f9" stroke-width="1.2"/>
  </g>
</svg>
