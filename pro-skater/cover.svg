<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <!-- Phony Bonk's Pro Skater's cover on the Arcade index (16:9): a skater flying high out of an orange
       quarter pipe against a blue sky, in the colours of Kenney Mini Skate, with the title on top. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb8f5"/>
      <stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#sky)"/>
  <!-- The park floor and the quarter pipe on the right. -->
  <rect y="212" width="480" height="58" fill="#8d86a8"/>
  <path d="M300 212H480V96H452C452 160 400 212 300 212Z" fill="#f08a4b"/>
  <path d="M452 96C452 160 400 212 300 212" fill="none" stroke="#c4602a" stroke-width="5"/>
  <rect x="446" y="84" width="34" height="14" fill="#9d97b8"/>
  <rect x="444" y="92" width="40" height="6" fill="#e2552f"/>
  <path d="M330 212C380 200 420 170 440 130" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="3" stroke-dasharray="8 8"/>
  <!-- A rail and a kicker on the floor. -->
  <path d="M40 196H190" stroke="#3a5cc4" stroke-width="6" stroke-linecap="round"/>
  <path d="M60 196V212M110 196V212M160 196V212" stroke="#3a5cc4" stroke-width="4"/>
  <path d="M200 212L250 186H272V212Z" fill="#f08a4b"/>
  <!-- The skater in the air, grabbing the board. -->
  <g transform="translate(372 70) rotate(-18)">
    <rect x="-34" y="44" width="68" height="9" rx="4.5" fill="#2b1d3a"/>
    <rect x="-32" y="42" width="64" height="6" rx="3" fill="#f2b33d"/>
    <circle cx="-20" cy="56" r="5" fill="#ffffff" stroke="#2b1d3a" stroke-width="2"/>
    <circle cx="20" cy="56" r="5" fill="#ffffff" stroke="#2b1d3a" stroke-width="2"/>
    <rect x="-16" y="24" width="12" height="20" rx="3" fill="#3f5fbf"/>
    <rect x="4" y="24" width="12" height="20" rx="3" fill="#3f5fbf"/>
    <rect x="-20" y="-6" width="40" height="32" rx="6" fill="#e2552f"/>
    <rect x="-34" y="0" width="16" height="10" rx="4" fill="#e2552f" transform="rotate(-30 -26 5)"/>
    <rect x="18" y="8" width="10" height="30" rx="4" fill="#e2552f"/>
    <rect x="-16" y="-40" width="32" height="34" rx="6" fill="#c98a5e"/>
    <rect x="-19" y="-48" width="38" height="14" rx="5" fill="#e2552f"/>
    <rect x="8" y="-40" width="22" height="7" rx="3" fill="#e2552f"/>
  </g>
  <!-- Title. -->
  <g font-family="'Arial Rounded MT Bold', 'Arial Black', 'Segoe UI Black', sans-serif" font-weight="900" text-anchor="start">
    <text x="24" y="58" font-size="20" fill="#2b1d3a" letter-spacing="2">PHONY BONK'S</text>
    <text x="22" y="108" font-size="50" fill="#fffaf0" stroke="#2b1d3a" stroke-width="8" stroke-linejoin="round" paint-order="stroke">PRO SKATER</text>
  </g>
</svg>
